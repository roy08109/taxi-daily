<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>生成 PWA 图标</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; }
  canvas { display: block; margin: 10px 0; border: 1px solid #ccc; }
  button { background: #4285f4; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin: 5px; }
  h2 { margin-bottom: 10px; }
  .tip { color: #666; font-size: 0.9em; margin-bottom: 15px; }
</style>
</head>
<body>
<h2>PWA 图标生成工具</h2>
<p class="tip">点击下方按钮，下载图标文件后放到项目根目录即可。</p>

<canvas id="c192" width="192" height="192"></canvas>
<button onclick="download('c192','icon-192.png')">下载 icon-192.png</button>

<canvas id="c512" width="512" height="512"></canvas>
<button onclick="download('c512','icon-512.png')">下载 icon-512.png</button>

<script>
function drawIcon(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const r = size * 0.12;

  // 背景圆角矩形
  ctx.fillStyle = '#4285f4';
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // 主文字「记账」
  const fs1 = Math.round(size * 0.32);
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${fs1}px Arial, "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('记账', size / 2, size * 0.42);

  // 副文字「收支」
  const fs2 = Math.round(size * 0.18);
  ctx.font = `${fs2}px Arial, "PingFang SC", sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('收支管理', size / 2, size * 0.72);
}

drawIcon('c192', 192);
drawIcon('c512', 512);

function download(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收支记账</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<!-- iOS PWA 支持 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- 主题色 -->
<meta name="theme-color" id="themeMeta" content="#4285f4">

<style>
:root{
  --bg:#fff; --card-bg:#fff; --border:#ccc; --text:#000;
  --th-bg:#f0f0f0; --time-color:#666; --input-bg:#fff;
  --input-border:#ccc; --op-bg:#4285f4; --sel-bg:#fff;
}
.dark{
  --bg:#121212; --card-bg:#1e1e1e; --border:#333; --text:#e0e0e0;
  --th-bg:#2a2a2a; --time-color:#999; --input-bg:#2a2a2a;
  --input-border:#444; --op-bg:#5a9cf5; --sel-bg:#2a2a2a;
}
*{box-sizing:border-box;font-family:Arial, sans-serif;margin:0;padding:0;}
body{padding:15px;max-width:600px;margin:0 auto;background:var(--bg);color:var(--text);transition:background .2s,color .2s;}
.card{border:1px solid var(--border);padding:15px;margin:10px 0;border-radius:6px;background:var(--card-bg);}
.add-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
.add-row select{flex-shrink:1;min-width:60px;max-width:90px;padding:5px 6px;background:var(--sel-bg);color:var(--text);border:1px solid var(--input-border);border-radius:4px;}
#amount{width:70px;flex-shrink:0;text-align:right;padding:5px 4px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:4px;}
.add-row button{flex-shrink:0;padding:5px 8px;}
.exp-row{display:flex;align-items:center;justify-content:space-between;margin:4px 0;gap:8px;}
.exp-row input{width:90px;text-align:right;padding:6px;margin:0;border:1px solid var(--input-border);border-radius:4px;background:var(--input-bg);color:var(--text);}
.exp-btn-row{margin-top:8px;text-align:right;display:flex;gap:6px;justify-content:flex-end;}
.exp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.exp-content{transition: all .2s ease;}
.hidden{display:none;}
table{width:100%;border-collapse:collapse;margin:10px 0;}
td,th{border:1px solid var(--border);padding:8px;text-align:right;}
th{background:var(--th-bg);text-align:left;}
.type-cell{text-align:left;}
.time-text{text-align:left;color:var(--time-color);font-size:.85em;}
.positive{color:#2ecc71;font-weight:bold;}
.negative{color:#e74c3c;font-weight:bold;}
.operate{background:var(--op-bg);color:#fff;border:none;border-radius:4px;cursor:pointer;width:auto;margin:0 2px;padding:5px 8px;}
.holiday{background:#ff9800;}
.normal{background:#2ecc71;}
.day-bar{display:flex;align-items:center;gap:10px;margin:8px 0 15px;font-size:1.1em;font-weight:bold;}
#darkToggle{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:1em;padding:4px 12px;margin-left:auto;color:var(--text);line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:all .2s;white-space:nowrap;}
#darkToggle:hover{box-shadow:0 2px 6px rgba(0,0,0,.15);}
#monthBtn{background:var(--op-bg);color:#fff;border:none;border-radius:20px;cursor:pointer;font-size:.9em;padding:4px 14px;line-height:1.5;white-space:nowrap;}
/* 月份总结弹窗 */
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:999;justify-content:center;align-items:center;}
.overlay.show{display:flex;}
.modal{background:var(--card-bg);color:var(--text);border-radius:14px;padding:24px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.3);}
.modal h3{margin-bottom:12px;font-size:1.2em;}
.modal table{width:100%;border-collapse:collapse;margin:10px 0;}
.modal td,.modal th{border:1px solid var(--border);padding:7px 10px;text-align:right;}
.modal th{background:var(--th-bg);text-align:left;}
.modal-close{display:block;margin:14px auto 0;background:var(--op-bg);color:#fff;border:none;border-radius:20px;padding:6px 24px;cursor:pointer;font-size:1em;}
</style>
</head>
<body>
<div class="day-bar">
  <span>选择日期：</span>
  <input type="date" id="datePicker">
  <button id="monthBtn" onclick="showMonthSummary()">📊 月结</button>
  <button id="darkToggle" onclick="toggleDark()" title="切换深色模式">浅色</button>
</div>

<div class="card">
  <h3>新增收款</h3>
  <div class="add-row">
    <select id="source">
      <option value="街客">街客</option>
      <option value="电召">电召</option>
      <option value="高德">高德</option>
      <option value="Uber">Uber</option>
      <option value="微信群单">微信群单</option>
    </select>
    <select id="type">
      <option value="电子支付">电子支付</option>
      <option value="港币现金">港币现金</option>
      <option value="葡币">葡币</option>
      <option value="人民币">人民币</option>
    </select>
    <input type="number" id="amount" placeholder="金额" step="1">
    <button class="operate" onclick="addRecord()">添加</button>
  </div>
</div>

<div class="card">
  <div class="exp-header">
    <h3>支出设置</h3>
    <button class="operate" id="foldExpBtn" onclick="toggleExp()">展开</button>
  </div>
  <div class="exp-content hidden" id="expContent">
    <div class="exp-row">
      <label>日租金(葡币)：</label>
      <input type="number" id="rent" value="0">
    </div>
    <div class="exp-row">
      <label>行驶公里：</label>
      <input type="number" id="km" value="0">
    </div>
    <div class="exp-row">
      <label>油费单价：</label>
      <input type="number" id="oilPrice" value="0">
    </div>
    <div class="exp-btn-row">
      <button class="operate holiday" onclick="setHoliday()">放假</button>
      <button class="operate normal" onclick="cancelHoliday()">出车精神</button>
    </div>
  </div>
</div>

<div class="card">
  <h3>收支汇总</h3>
  <table>
    <tr><th class="type-cell">项目</th><th>金额</th></tr>
    <tr><td class="type-cell">电子支付</td><td id="ePay">0</td></tr>
    <tr><td class="type-cell">港币现金</td><td id="hkd">0</td></tr>
    <tr><td class="type-cell">葡币</td><td id="mop">0</td></tr>
    <tr><td class="type-cell">人民币</td><td id="cny">0</td></tr>
    <tr><td class="type-cell"><strong>总收入</strong></td><td id="totalIncome">0</td></tr>
    <tr><td class="type-cell">租金支出</td><td id="rentShow">0</td></tr>
    <tr><td class="type-cell">油费</td><td id="oilCost">0</td></tr>
    <tr><td class="type-cell"><strong>总支出</strong></td><td id="totalCost">0</td></tr>
    <tr>
      <td class="type-cell"><strong>当日盈亏</strong></td>
      <td id="profit">0</td>
    </tr>
  </table>
</div>

<div class="card">
  <h3>当日收款明细（仅显示时分）</h3>
  <table id="listTable">
    <thead>
      <tr>
        <th class="type-cell">单号</th>
        <th class="type-cell">来源</th>
        <th class="type-cell">支付方式</th>
        <th>金额</th>
        <th class="time-text">时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</div>

<div class="overlay" id="monthOverlay" onclick="if(event.target===this)closeMonthSummary()">
  <div class="modal">
    <h3 id="monthTitle">月份总结</h3>
    <div id="monthBody"></div>
    <button class="modal-close" onclick="closeMonthSummary()">关闭</button>
  </div>
</div>

<script>
let records = [];
let currentDateKey = '';
let normalRent = 550;
let normalKm = 0;
let normalOilPrice = 1.1;
let isHoliday = true;
let expFolded = true;
let darkMode = false;

function toggleExp(){
  const content = document.getElementById('expContent');
  const btn = document.getElementById('foldExpBtn');
  expFolded = !expFolded;
  if(expFolded){
    content.classList.add('hidden');
    btn.textContent = '展开';
  }else{
    content.classList.remove('hidden');
    btn.textContent = '折叠';
  }
}

function toggleDark(){
  darkMode = !darkMode;
  document.body.classList.toggle('dark', darkMode);
  document.getElementById('darkToggle').textContent = darkMode ? '浅色' : '深色';
  document.getElementById('themeMeta').content = darkMode ? '#121212' : '#4285f4';
  try{ localStorage.setItem('taxiDarkMode', darkMode ? '1' : '0'); }catch(e){}
}

function formatTimeOnly(ts){
  if(!ts) return '';
  const d=new Date(ts);
  const h=String(d.getHours()).padStart(2,'0');
  const mi=String(d.getMinutes()).padStart(2,'0');
  return `${h}:${mi}`;
}

function setHoliday(){
  if(isHoliday) return;
  normalRent = parseFloat(document.getElementById('rent').value)||0;
  normalKm = parseFloat(document.getElementById('km').value)||0;
  normalOilPrice = parseFloat(document.getElementById('oilPrice').value)||0;
  document.getElementById('rent').value = 0;
  document.getElementById('km').value = 0;
  document.getElementById('oilPrice').value = 0;
  isHoliday = true;
  saveDayData();
  calc();
}

function cancelHoliday(){
  if(!isHoliday) return;
  document.getElementById('rent').value = normalRent;
  document.getElementById('km').value = normalKm;
  document.getElementById('oilPrice').value = normalOilPrice;
  isHoliday = false;
  saveDayData();
  calc();
}

function loadDayData(dateKey){
  currentDateKey = dateKey;
  const storeKey = `taxiDay_${dateKey}`;
  const saved = localStorage.getItem(storeKey);
  let dayData = {records:[], rent:0, km:0, oilPrice:0, normalRent:550, normalKm:0, normalOilPrice:1.1, isHoliday:true};
  if(saved){
    try{ dayData = JSON.parse(saved); }catch(e){}
  }
  records = Array.isArray(dayData.records) ? dayData.records : [];
  normalRent = dayData.normalRent ?? 550;
  normalKm = dayData.normalKm ?? 0;
  normalOilPrice = dayData.normalOilPrice ?? 1.1;
  isHoliday = dayData.isHoliday ?? false;

  if(isHoliday){
    document.getElementById('rent').value = 0;
    document.getElementById('km').value = 0;
    document.getElementById('oilPrice').value = 0;
  }else{
    document.getElementById('rent').value = normalRent;
    document.getElementById('km').value = normalKm;
    document.getElementById('oilPrice').value = normalOilPrice;
  }
  calc();
  renderList();
}

function saveDayData(){
  if(!currentDateKey) return;
  const storeKey = `taxiDay_${currentDateKey}`;
  const dayData = {
    records,
    rent: parseFloat(document.getElementById('rent').value)||0,
    km: parseFloat(document.getElementById('km').value)||0,
    oilPrice: parseFloat(document.getElementById('oilPrice').value)||0,
    normalRent,normalKm,normalOilPrice,isHoliday
  };
  try{ localStorage.setItem(storeKey, JSON.stringify(dayData)); }catch(e){}
}

function bindInputs(){
  ['rent','km','oilPrice'].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('input',()=>{
      if(!isHoliday){
        normalRent = parseFloat(document.getElementById('rent').value)||0;
        normalKm = parseFloat(document.getElementById('km').value)||0;
        normalOilPrice = parseFloat(document.getElementById('oilPrice').value)||0;
      }
      saveDayData();
      calc();
    });
  });
  document.getElementById('datePicker').addEventListener('change',e=>loadDayData(e.target.value));
}

function addRecord(){
  const source=document.getElementById('source').value;
  const type=document.getElementById('type').value;
  const amt=parseInt(document.getElementById('amount').value);
  if(isNaN(amt)||amt<=0){ alert('输入有效整数金额'); return; }
  records.push({source,type,amount:amt,time:Date.now()});
  saveDayData();
  calc();
  renderList();
  document.getElementById('amount').value='';
}

function calc(){
  const ePay=records.filter(r=>r.type==='电子支付').reduce((s,i)=>s+i.amount,0);
  const hkd=records.filter(r=>r.type==='港币现金').reduce((s,i)=>s+i.amount,0);
  const mop=records.filter(r=>r.type==='葡币').reduce((s,i)=>s+i.amount,0);
  const cny=records.filter(r=>r.type==='人民币').reduce((s,i)=>s+i.amount,0);
  const total=ePay+hkd+mop+cny;

  const rent=parseFloat(document.getElementById('rent').value)||0;
  const km=parseFloat(document.getElementById('km').value)||0;
  const oilP=parseFloat(document.getElementById('oilPrice').value)||0;
  const oil=Math.round(km*oilP);
  const totalCost=rent+oil;
  const profit=total-totalCost;

  document.getElementById('ePay').textContent=ePay;
  document.getElementById('hkd').textContent=hkd;
  document.getElementById('mop').textContent=mop;
  document.getElementById('cny').textContent=cny;
  document.getElementById('totalIncome').textContent=total;
  document.getElementById('rentShow').textContent=Math.round(rent);
  document.getElementById('oilCost').textContent=oil;
  document.getElementById('totalCost').textContent=totalCost;

  const pTd=document.getElementById('profit');
  pTd.textContent=profit;
  pTd.className=profit>=0?'positive':'negative';
}

function renderList(){
  const wrap=document.getElementById('list');
  wrap.innerHTML='';
  if(records.length===0){
    wrap.innerHTML='<tr><td colspan="6" class="type-cell">暂无收款记录</td>';
    return;
  }
  records.forEach((item,idx)=>{
    const tr=document.createElement('tr');
    const timeStr=formatTimeOnly(item.time);
    tr.innerHTML=`
      <td class="type-cell">${idx+1}</td>
      <td class="type-cell">${item.source}</td>
      <td class="type-cell">${item.type}</td>
      <td>${item.amount}</td>
      <td class="time-text">${timeStr}</td>
      <td></td>
    `;
    const btn=document.createElement('button');
    btn.className='operate';
    btn.textContent='删除';
    btn.addEventListener('click',()=>{
      if(!confirm('确定删除第'+(idx+1)+'条记录？')) return;
      records.splice(idx,1);
      saveDayData();
      calc();
      renderList();
    });
    tr.lastElementChild.appendChild(btn);
    wrap.appendChild(tr);
  });
}

function showMonthSummary(){
  const datePicker = document.getElementById('datePicker');
  const d = new Date(datePicker.value);
  const year = d.getFullYear();
  const month = d.getMonth() + 1;
  document.getElementById('monthTitle').textContent = `${year}年${month}月 总结`;

  const daysInMonth = new Date(year, month, 0).getDate();
  let totalEPay=0, totalHKD=0, totalMOP=0, totalCNY=0;
  let totalRent=0, totalOil=0, totalKm=0, dayCount=0, holidayCount=0, recordCount=0;

  // 三段结：1-10, 11-20, 21-月尾
  const periods = [
    {label:'上旬(1-10日)', start:1, end:10, EPay:0, HKD:0, MOP:0, CNY:0, rent:0, oil:0, km:0, days:0, holi:0, recs:0},
    {label:'中旬(11-20日)', start:11, end:20, EPay:0, HKD:0, MOP:0, CNY:0, rent:0, oil:0, km:0, days:0, holi:0, recs:0},
    {label:'下旬(21-'+daysInMonth+'日)', start:21, end:daysInMonth, EPay:0, HKD:0, MOP:0, CNY:0, rent:0, oil:0, km:0, days:0, holi:0, recs:0}
  ];

  for(let day=1; day<=daysInMonth; day++){
    const dk = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const key = `taxiDay_${dk}`;
    const saved = localStorage.getItem(key);
    if(!saved) continue;
    let dd;
    try{ dd = JSON.parse(saved); }catch(e){ continue; }
    const recs = Array.isArray(dd.records) ? dd.records : [];
    if(recs.length === 0 && !dd.isHoliday && !dd.rent && !dd.km) continue;
    dayCount++;
    if(dd.isHoliday) holidayCount++;
    recordCount += recs.length;
    recs.forEach(r => {
      if(r.type === '电子支付') totalEPay += r.amount;
      else if(r.type === '港币现金') totalHKD += r.amount;
      else if(r.type === '葡币') totalMOP += r.amount;
      else if(r.type === '人民币') totalCNY += r.amount;
    });
    totalRent += dd.rent || 0;
    totalKm += dd.km || 0;
    totalOil += Math.round((dd.km||0) * (dd.oilPrice||0));

    // 累加到对应时段
    const pIdx = day<=10 ? 0 : day<=20 ? 1 : 2;
    const p = periods[pIdx];
    recs.forEach(r => {
      if(r.type === '电子支付') p.EPay += r.amount;
      else if(r.type === '港币现金') p.HKD += r.amount;
      else if(r.type === '葡币') p.MOP += r.amount;
      else if(r.type === '人民币') p.CNY += r.amount;
    });
    p.rent += dd.rent || 0;
    p.km += dd.km || 0;
    p.oil += Math.round((dd.km||0) * (dd.oilPrice||0));
    p.days++;
    if(dd.isHoliday) p.holi++;
    p.recs += recs.length;
  }

  const totalIncome = totalEPay + totalHKD + totalMOP + totalCNY;
  const totalCost = totalRent + totalOil;
  const profit = totalIncome - totalCost;
  const workDays = dayCount - holidayCount;
  const avgIncome = workDays > 0 ? Math.round(totalIncome / workDays) : 0;
  const avgProfit = workDays > 0 ? Math.round(profit / workDays) : 0;

  // 生成三段表格 HTML（仅显示租金）
  let periodHtml = '';
  periods.forEach((p, i) => {
    const pWork = p.days - p.holi;
    periodHtml += `
      <div style="margin-top:${i===0?'16px':'10px'};font-size:.95em;">
        <strong>${p.label}</strong>
        <table>
          <tr><th class="type-cell">项目</th><th>金额</th></tr>
          <tr><td class="type-cell">出车/放假</td><td>${pWork}天 / ${p.holi}天</td></tr>
          <tr><td class="type-cell">租金(葡币)</td><td>${p.rent}</td></tr>
        </table>
      </div>`;
  });

  document.getElementById('monthBody').innerHTML = `
    <table>
      <tr><th class="type-cell">项目</th><th>金额</th></tr>
      <tr><td class="type-cell">出车天数</td><td>${workDays} 天</td></tr>
      <tr><td class="type-cell">放假天数</td><td>${holidayCount} 天</td></tr>
      <tr><td class="type-cell">总收款笔数</td><td>${recordCount} 笔</td></tr>
      <tr><td class="type-cell">电子支付</td><td>${totalEPay}</td></tr>
      <tr><td class="type-cell">港币现金</td><td>${totalHKD}</td></tr>
      <tr><td class="type-cell">葡币</td><td>${totalMOP}</td></tr>
      <tr><td class="type-cell">人民币</td><td>${totalCNY}</td></tr>
      <tr><td class="type-cell"><strong>总收入</strong></td><td>${totalIncome}</td></tr>
      <tr><td class="type-cell">总租金(葡币)</td><td>${totalRent}</td></tr>
      <tr><td class="type-cell">总油费</td><td>${totalOil}</td></tr>
      <tr><td class="type-cell">总行驶公里</td><td>${Math.round(totalKm)} km</td></tr>
      <tr><td class="type-cell"><strong>总支出</strong></td><td>${totalCost}</td></tr>
      <tr><td class="type-cell"><strong>当月盈亏</strong></td>
        <td class="${profit>=0?'positive':'negative'}">${profit}</td>
      </tr>
      <tr><td class="type-cell">日均收入(出车日)</td><td>${avgIncome}</td></tr>
      <tr><td class="type-cell">日均盈利(出车日)</td><td class="${avgProfit>=0?'positive':'negative'}">${avgProfit}</td></tr>
    </table>
    ${periodHtml}
  `;
  document.getElementById('monthOverlay').classList.add('show');
}

function closeMonthSummary(){
  document.getElementById('monthOverlay').classList.remove('show');
}

window.addEventListener('DOMContentLoaded',()=>{
  // 加载深色模式偏好
  try{
    const dm = localStorage.getItem('taxiDarkMode');
    if(dm === '1'){
      darkMode = true;
      document.body.classList.add('dark');
      document.getElementById('darkToggle').textContent = '浅色';
      document.getElementById('themeMeta').content = '#121212';
    }
  }catch(e){}

  const today = new Date().toISOString().split('T')[0];
  document.getElementById('datePicker').value = today;
  loadDayData(today);
  bindInputs();

  // 注册 Service Worker（updateViaCache:none 防止浏览器缓存 SW 文件）
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'})
      .then(reg => {
        console.log('SW registered:', reg.scope);
        // 检测到新 SW 时自动刷新页面
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if(refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      })
      .catch(err => console.warn('SW registration failed:', err));
  }
});
</script>
</body>
</html>
